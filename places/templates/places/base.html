{% load static %}
<!DOCTYPE html>
<html>
<head>

    <link rel="stylesheet" href="{% static 'places/css/style.css' %}">

    <title>{% block title %}Куди піти?{% endblock %}</title>
</head>
<body>
    <header>
        <p>Куди піти?</p>

        <nav>
            <a href="{% url 'places:home' %}">Головна</a>

    <footer>
        <p>Сайт створено: РЯБЧЕНКО МИХАЙЛО. Дата: 21.09.2026</p>
